name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"

jobs:
  app-tests:
    name: Application Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and run pytest
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -v

  static-checks:
    name: Terraform Format, Validate, TFLint & Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.54.0

      - name: Init TFLint
        run: tflint --init --config="${{ github.workspace }}/.tflint.hcl"

      - name: Validate and TFLint each stack
        run: |
          for dir in terraform/envs/*/; do
            echo "=== Checking $dir ==="
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
            tflint --chdir="$dir" --config="${{ github.workspace }}/.tflint.hcl"
          done

      - name: Trivy IaC Security Scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: config
          scan-ref: terraform/
          exit-code: "1"
          severity: CRITICAL,HIGH

  plan-aws:
    name: Plan AWS (${{ matrix.env }})
    needs: static-checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Install Conftest
        run: |
          mkdir -p "${{ runner.temp }}/bin"
          curl -fsSL -o "${{ runner.temp }}/conftest.tar.gz" "https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz"
          tar xzf "${{ runner.temp }}/conftest.tar.gz" -C "${{ runner.temp }}/bin" conftest
          rm "${{ runner.temp }}/conftest.tar.gz"
          echo "${{ runner.temp }}/bin" >> "$GITHUB_PATH"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init & Plan
        id: plan
        env:
          TF_VAR_username: ${{ vars.USERNAME }}
          TF_VAR_name_prefix: ${{ vars.NAME_PREFIX }}
          TF_VAR_env: ${{ matrix.env }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_aws_backup_task_role_arn: ${{ vars.AWS_BACKUP_TASK_ROLE_ARN }}
          TF_VAR_gcp_aws_wif_provider: ${{ vars.GCP_AWS_WIF_PROVIDER }}
          TF_VAR_gcp_backup_writer_sa: ${{ vars.GCP_BACKUP_WRITER_SERVICE_ACCOUNT }}
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_repo_url: ${{ github.server_url }}/${{ github.repository }}
        run: |
          STACK_DIR="terraform/envs/aws-${{ matrix.env }}"
          terraform -chdir="$STACK_DIR" init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.USERNAME }}/aws-${{ matrix.env }}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
          terraform -chdir="$STACK_DIR" plan -no-color -out=tfplan.binary
          terraform -chdir="$STACK_DIR" show -json tfplan.binary > "$STACK_DIR/tfplan.json"
          terraform -chdir="$STACK_DIR" show -no-color tfplan.binary > "$STACK_DIR/tfplan.txt"

      - name: Enforce Mandatory Username Tag & Security Policy (Python + OPA Conftest)
        run: |
          STACK_DIR="terraform/envs/aws-${{ matrix.env }}"
          python3 .github/scripts/check_tags.py "$STACK_DIR/tfplan.json" "${{ vars.USERNAME }}"
          conftest test "$STACK_DIR/tfplan.json" --policy .github/policy

      - name: Post Plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const stackDir = `terraform/envs/aws-${{ matrix.env }}`;
            let plan = fs.readFileSync(`${stackDir}/tfplan.txt`, 'utf8');
            if (plan.length > 60000) {
              plan = plan.slice(0, 60000) + '\n... (truncated)';
            }
            const marker = `<!-- tf-plan-aws-${{ matrix.env }} -->`;
            const body = `${marker}\n### Terraform Plan: \`aws-${{ matrix.env }}\`\n\n<details><summary>Show Plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  plan-gcp:
    name: Plan GCP (${{ matrix.env }})
    needs: static-checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Install Conftest
