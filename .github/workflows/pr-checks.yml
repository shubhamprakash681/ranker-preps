          curl -fsSL -o "${{ runner.temp }}/conftest.tar.gz" "https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz"
          tar xzf "${{ runner.temp }}/conftest.tar.gz" -C "${{ runner.temp }}/bin" conftest
          rm "${{ runner.temp }}/conftest.tar.gz"
          echo "${{ runner.temp }}/bin" >> "$GITHUB_PATH"

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Terraform Init & Plan
        env:
          TF_VAR_username: ${{ vars.USERNAME }}
          TF_VAR_name_prefix: ${{ vars.NAME_PREFIX }}
          TF_VAR_env: ${{ matrix.env }}
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_gcp_region: ${{ vars.GCP_REGION }}
          TF_VAR_gcp_runtime_sa: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          TF_VAR_gcp_restore_sa: ${{ vars.GCP_RESTORE_SERVICE_ACCOUNT }}
          TF_VAR_gcp_scheduler_sa: ${{ vars.GCP_SCHEDULER_SERVICE_ACCOUNT }}
          TF_VAR_gcp_backup_writer_sa: ${{ vars.GCP_BACKUP_WRITER_SERVICE_ACCOUNT }}
          TF_VAR_repo_url: ${{ github.server_url }}/${{ github.repository }}
        run: |
          STACK_DIR="terraform/envs/gcp-${{ matrix.env }}"
          terraform -chdir="$STACK_DIR" init \
            -backend-config="bucket=${{ vars.GCP_TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ vars.USERNAME }}/gcp-${{ matrix.env }}"
          terraform -chdir="$STACK_DIR" plan -no-color -out=tfplan.binary
          terraform -chdir="$STACK_DIR" show -json tfplan.binary > "$STACK_DIR/tfplan.json"
          terraform -chdir="$STACK_DIR" show -no-color tfplan.binary > "$STACK_DIR/tfplan.txt"

      - name: Enforce Mandatory Username Label & Security Policy (Python + OPA Conftest)
        run: |
          STACK_DIR="terraform/envs/gcp-${{ matrix.env }}"
          python3 .github/scripts/check_tags.py "$STACK_DIR/tfplan.json" "${{ vars.USERNAME }}"
          conftest test "$STACK_DIR/tfplan.json" --policy .github/policy

      - name: Post Plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const stackDir = `terraform/envs/gcp-${{ matrix.env }}`;
            let plan = fs.readFileSync(`${stackDir}/tfplan.txt`, 'utf8');
            if (plan.length > 60000) {
              plan = plan.slice(0, 60000) + '\n... (truncated)';
            }
            const marker = `<!-- tf-plan-gcp-${{ matrix.env }} -->`;
            const body = `${marker}\n### Terraform Plan: \`gcp-${{ matrix.env }}\`\n\n<details><summary>Show Plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  plan-edge:
