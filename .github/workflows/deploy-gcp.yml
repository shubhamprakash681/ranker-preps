name: Deploy GCP Platform

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - "requirements.txt"
      - "terraform/modules/gcp-platform/**"
      - "terraform/envs/gcp-dev/**"
      - ".github/workflows/deploy-gcp.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-gcp-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"

jobs:
  test-and-scan-build:
    name: Build & Scan Container
    runs-on: ubuntu-latest
    outputs:
      image_tag: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Run Unit Tests
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: northwind-orders:sha-${{ github.sha }}

      - name: Scan Image with Trivy (Report HIGH & CRITICAL)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: northwind-orders:sha-${{ github.sha }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Gate Image Scan on CRITICAL Vulnerabilities
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: northwind-orders:sha-${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL

      - name: Save Image Archive
        run: docker save northwind-orders:sha-${{ github.sha }} -o /tmp/northwind-orders.tar

      - uses: actions/upload-artifact@v4
        with:
          name: gcp-container-image
          path: /tmp/northwind-orders.tar
          retention-days: 1

  deploy-dev:
    name: Deploy GCP Dev
    needs: test-and-scan-build
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - uses: actions/download-artifact@v4
        with:
          name: gcp-container-image
          path: /tmp

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Terraform Init (gcp-dev)
        run: |
          terraform -chdir=terraform/envs/gcp-dev init \
            -backend-config="bucket=${{ vars.GCP_TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ vars.USERNAME }}/gcp-dev"

      - name: Ensure Dev Artifact Registry Exists & Push Image
        id: push
        env:
          TF_VAR_username: ${{ vars.USERNAME }}
          TF_VAR_name_prefix: ${{ vars.NAME_PREFIX }}
          TF_VAR_env: dev
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_gcp_region: ${{ vars.GCP_REGION }}
          TF_VAR_gcp_runtime_sa: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
        run: |
          terraform -chdir=terraform/envs/gcp-dev apply -no-color \
            -target=module.gcp_platform.google_artifact_registry_repository.app -auto-approve
          AR_URL=$(terraform -chdir=terraform/envs/gcp-dev output -json | jq -r '.artifact_registry_url.value')
          gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin "https://${{ vars.GCP_REGION }}-docker.pkg.dev"
          docker load -i /tmp/northwind-orders.tar
          TAG="sha-${{ github.sha }}"
          IMAGE_TAG="${AR_URL}/orders:${TAG}"
          docker tag "northwind-orders:${TAG}" "$IMAGE_TAG"
          docker push "$IMAGE_TAG"
          IMAGE_REF=$(gcloud artifacts docker images describe "$IMAGE_TAG" --format='value(image_summary.fully_qualified_digest)' || true)
          if [ -z "$IMAGE_REF" ]; then
            IMAGE_REF=$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE_TAG" | grep "^${AR_URL}/orders@sha256:" | head -n1 || true)
          fi
          if [[ "$IMAGE_REF" != "${AR_URL}/orders@sha256:"* ]]; then
            echo "ERROR: Could not resolve Artifact Registry digest for $IMAGE_TAG (got '$IMAGE_REF')" >&2
            exit 1
          fi
          echo "Pushed immutable image ref: $IMAGE_REF"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"

      - name: Terraform Apply (gcp-dev)
        env:
          TF_VAR_username: ${{ vars.USERNAME }}
          TF_VAR_name_prefix: ${{ vars.NAME_PREFIX }}
          TF_VAR_env: dev
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_gcp_region: ${{ vars.GCP_REGION }}
          TF_VAR_gcp_runtime_sa: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          TF_VAR_gcp_restore_sa: ${{ vars.GCP_RESTORE_SERVICE_ACCOUNT }}
          TF_VAR_gcp_scheduler_sa: ${{ vars.GCP_SCHEDULER_SERVICE_ACCOUNT }}
          TF_VAR_gcp_backup_writer_sa: ${{ vars.GCP_BACKUP_WRITER_SERVICE_ACCOUNT }}
          TF_VAR_image_ref: ${{ steps.push.outputs.image_ref }}
          TF_VAR_repo_url: ${{ github.server_url }}/${{ github.repository }}
        run: |
          terraform -chdir=terraform/envs/gcp-dev apply -no-color -auto-approve
