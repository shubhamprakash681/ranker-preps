name: Drift Detection

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: drift-detection
  cancel-in-progress: true

jobs:
  check-aws-drift:
    name: Check AWS Drift (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init & Plan (detailed-exitcode)
        id: plan
        continue-on-error: true
        env:
          TF_VAR_username: ${{ vars.USERNAME }}
          TF_VAR_name_prefix: ${{ vars.NAME_PREFIX }}
          TF_VAR_env: ${{ matrix.env }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_aws_backup_task_role_arn: ${{ vars.AWS_BACKUP_TASK_ROLE_ARN }}
          TF_VAR_gcp_aws_wif_provider: ${{ vars.GCP_AWS_WIF_PROVIDER }}
          TF_VAR_gcp_backup_writer_sa: ${{ vars.GCP_BACKUP_WRITER_SERVICE_ACCOUNT }}
          TF_VAR_repo_url: ${{ github.server_url }}/${{ github.repository }}
        run: |
          STACK_DIR="terraform/envs/aws-${{ matrix.env }}"
          terraform -chdir="$STACK_DIR" init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.USERNAME }}/aws-${{ matrix.env }}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
          set +e
          terraform -chdir="$STACK_DIR" plan -detailed-exitcode -no-color > /tmp/drift.txt 2>&1
          EXIT_CODE=$?
          set -e
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [ "$EXIT_CODE" -eq 1 ]; then
            cat /tmp/drift.txt
            exit 1
          fi

      - name: Open Drift Issue
        if: steps.plan.outputs.exit_code == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let diff = fs.readFileSync('/tmp/drift.txt', 'utf8');
            if (diff.length > 50000) diff = diff.slice(0, 50000) + '\n... (truncated)';
            const title = `Infrastructure drift detected in aws-${{ matrix.env }}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const existing = issues.find(i => i.title === title);
            const body = `Drift detected during scheduled run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n\`\`\`hcl\n${diff}\n\`\`\``;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['drift'],
              });
            }

  check-gcp-drift:
    name: Check GCP Drift (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Terraform Init & Plan (detailed-exitcode)
        id: plan
        continue-on-error: true
        env:
          TF_VAR_username: ${{ vars.USERNAME }}
          TF_VAR_name_prefix: ${{ vars.NAME_PREFIX }}
          TF_VAR_env: ${{ matrix.env }}
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_gcp_region: ${{ vars.GCP_REGION }}
          TF_VAR_gcp_runtime_sa: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          TF_VAR_gcp_restore_sa: ${{ vars.GCP_RESTORE_SERVICE_ACCOUNT }}
          TF_VAR_gcp_scheduler_sa: ${{ vars.GCP_SCHEDULER_SERVICE_ACCOUNT }}
          TF_VAR_gcp_backup_writer_sa: ${{ vars.GCP_BACKUP_WRITER_SERVICE_ACCOUNT }}
          TF_VAR_repo_url: ${{ github.server_url }}/${{ github.repository }}
        run: |
          STACK_DIR="terraform/envs/gcp-${{ matrix.env }}"
          terraform -chdir="$STACK_DIR" init \
            -backend-config="bucket=${{ vars.GCP_TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ vars.USERNAME }}/gcp-${{ matrix.env }}"
          set +e
          terraform -chdir="$STACK_DIR" plan -detailed-exitcode -no-color > /tmp/drift-gcp.txt 2>&1
          EXIT_CODE=$?
          set -e
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [ "$EXIT_CODE" -eq 1 ]; then
            cat /tmp/drift-gcp.txt
            exit 1
          fi

      - name: Open Drift Issue
        if: steps.plan.outputs.exit_code == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let diff = fs.readFileSync('/tmp/drift-gcp.txt', 'utf8');
            if (diff.length > 50000) diff = diff.slice(0, 50000) + '\n... (truncated)';
            const title = `Infrastructure drift detected in gcp-${{ matrix.env }}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const existing = issues.find(i => i.title === title);
            const body = `Drift detected during scheduled run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n\`\`\`hcl\n${diff}\n\`\`\``;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['drift'],
              });
            }
