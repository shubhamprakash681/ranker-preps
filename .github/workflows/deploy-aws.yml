name: Deploy AWS Platform

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - "requirements.txt"
      - "terraform/modules/aws-platform/**"
      - "terraform/envs/aws-dev/**"
      - ".github/workflows/deploy-aws.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-aws-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"

jobs:
  test-and-scan-build:
    name: Build & Scan Container
    runs-on: ubuntu-latest
    outputs:
      image_tag: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Run Unit Tests
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image (OCI archive for scanning & promotion)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: northwind-orders:sha-${{ github.sha }}

      - name: Scan Image with Trivy (Report HIGH & CRITICAL)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: northwind-orders:sha-${{ github.sha }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Gate Image Scan on CRITICAL Vulnerabilities
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: northwind-orders:sha-${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL

      - name: Save Image Archive
        run: docker save northwind-orders:sha-${{ github.sha }} -o /tmp/northwind-orders.tar

      - uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: /tmp/northwind-orders.tar
          retention-days: 1

  deploy-dev:
    name: Deploy AWS Dev
    needs: test-and-scan-build
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      dev_image_ref: ${{ steps.push.outputs.image_ref }}
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - uses: actions/download-artifact@v4
        with:
          name: container-image
          path: /tmp

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init (aws-dev)
        run: |
          terraform -chdir=terraform/envs/aws-dev init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.USERNAME }}/aws-dev/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Ensure Dev ECR Repository Exists & Push Image
        id: push
        env:
          TF_VAR_username: ${{ vars.USERNAME }}
          TF_VAR_name_prefix: ${{ vars.NAME_PREFIX }}
          TF_VAR_env: dev
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_aws_backup_task_role_arn: ${{ vars.AWS_BACKUP_TASK_ROLE_ARN }}
          TF_VAR_gcp_aws_wif_provider: ${{ vars.GCP_AWS_WIF_PROVIDER }}
          TF_VAR_gcp_backup_writer_sa: ${{ vars.GCP_BACKUP_WRITER_SERVICE_ACCOUNT }}
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_repo_url: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # If ECR module resource exists in .tf config, target-apply it first so the image can be pushed before ECS starts
          if grep -rq --include="*.tf" --exclude-dir=".terraform" "aws_ecr_repository" terraform/ 2>/dev/null; then
            terraform -chdir=terraform/envs/aws-dev apply -no-color -target=module.aws_platform.aws_ecr_repository.app -auto-approve
            ECR_URL=$(terraform -chdir=terraform/envs/aws-dev output -json 2>/dev/null | jq -r '.ecr_repository_url.value // empty')
            if [ -n "$ECR_URL" ]; then
              aws ecr get-login-password --region "${{ vars.AWS_REGION }}" | docker login --username AWS --password-stdin "${ECR_URL%%/*}"
              docker load -i /tmp/northwind-orders.tar
              TAG="sha-${{ github.sha }}"
              docker tag "northwind-orders:$TAG" "$ECR_URL:$TAG"
              docker push "$ECR_URL:$TAG"
              DIGEST=$(aws ecr describe-images --repository-name "${ECR_URL#*/}" --image-ids imageTag="$TAG" --query 'imageDetails[0].imageDigest' --output text)
              echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
              echo "image_ref=$ECR_URL@$DIGEST" >> "$GITHUB_OUTPUT"
            else
              echo "digest=" >> "$GITHUB_OUTPUT"
              echo "image_ref=" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No ECR resource defined yet (bootstrap phase)"
            echo "digest=" >> "$GITHUB_OUTPUT"
            echo "image_ref=" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform Apply (aws-dev)
        env:
          TF_VAR_username: ${{ vars.USERNAME }}
          TF_VAR_name_prefix: ${{ vars.NAME_PREFIX }}
          TF_VAR_env: dev
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_image_digest: ${{ steps.push.outputs.digest }}
          TF_VAR_aws_backup_task_role_arn: ${{ vars.AWS_BACKUP_TASK_ROLE_ARN }}
          TF_VAR_gcp_aws_wif_provider: ${{ vars.GCP_AWS_WIF_PROVIDER }}
          TF_VAR_gcp_backup_writer_sa: ${{ vars.GCP_BACKUP_WRITER_SERVICE_ACCOUNT }}
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_repo_url: ${{ github.server_url }}/${{ github.repository }}
        run: |
          terraform -chdir=terraform/envs/aws-dev apply -auto-approve
