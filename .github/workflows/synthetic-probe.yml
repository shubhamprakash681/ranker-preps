name: Synthetic Probe

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: synthetic-probe
  cancel-in-progress: true

jobs:
  probe:
    name: Probe Public Endpoint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run Synthetic Probe Against Public Hostname
        id: probe
        continue-on-error: true
        run: |
          terraform -chdir=terraform/envs/edge-dev init -no-color \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.USERNAME }}/edge-dev/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true" >/dev/null
          CF_DOMAIN=$(terraform -chdir=terraform/envs/edge-dev output -json | jq -r '.cloudfront_domain_name.value // empty')
          if [ -z "$CF_DOMAIN" ]; then
            echo "Edge not deployed yet; skipping probe."
            exit 0
          fi
          python3 .github/scripts/probe.py "https://$CF_DOMAIN" | tee /tmp/probe.out
          exit ${PIPESTATUS[0]}

      - name: Fail Visibly & Open Alert Issue on Outage
        if: steps.probe.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const out = fs.existsSync('/tmp/probe.out') ? fs.readFileSync('/tmp/probe.out', 'utf8') : 'No output';
            const title = 'Synthetic Probe FAILED: Northwind Orders public endpoint unhealthy';
            const body = `Synthetic probe failed at ${new Date().toISOString()}.\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n\`\`\`\n${out}\n\`\`\`\n\nRunbook: docs/runbooks/endpoint-down.md`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['incident', 'probe-failure'],
            });
            core.setFailed('Synthetic probe failed against public hostname.');
